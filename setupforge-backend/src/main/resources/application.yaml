server:
  port: 8086

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: setupforge-backend

  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: false
    locations: classpath:db/migration

