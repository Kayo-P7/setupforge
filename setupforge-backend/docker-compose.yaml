name: setupforge_container

services:
  database:
   image: postgres:16
   container_name: setupforge_db
   restart: unless-stopped
   ports:
     - "5437:5432"
   environment:
     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
     POSTGRES_DB: ${POSTGRES_DB}
     POSTGRES_USER: ${POSTGRES_USER}

   volumes:
     - setupforge:/var/lib/postgresql/data

volumes:
  setupforge:


